name: course-monitor

on:
  schedule:
    - cron: "0 * * * *"   # كل ساعة
  workflow_dispatch:       # تشغيل يدوي للتجربة
    inputs:
      test:
        description: "أرسل إشعارًا تجريبيًا فقط (للتأكد أن الجوال يستقبل)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium

      - run: python monitor.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFY: ${{ inputs.test }}

      - name: Save state
        run: |
          git config user.name "monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
